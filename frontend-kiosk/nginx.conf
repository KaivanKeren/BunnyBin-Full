server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;

    # SPA: seluruh path non-berkas dikembalikan ke index.html supaya refresh di
    # /units/1 tidak menghasilkan 404 dari nginx.
    location / {
        try_files $uri $uri/ /index.html;
    }

    # Aset ber-hash dari Vite aman di-cache lama; index.html tidak boleh,
    # karena ia yang menunjuk ke nama berkas hash terbaru.
    location /assets/ {
        expires 1y;
        add_header Cache-Control "public, immutable";
    }

    location = /index.html {
        add_header Cache-Control "no-cache";
    }

    gzip on;
    gzip_types text/css application/javascript application/json image/svg+xml;
    gzip_min_length 1024;
}
