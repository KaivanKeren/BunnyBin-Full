# Compose DEV — hanya dependensi lokal (database) untuk pengembangan backend.
# Compose produksi full-stack (Fase 8) akan berada di root repo sesuai
# docs/PRD-Infrastructure-Deployment.md §2; nama project dibedakan agar tidak bentrok.
#
#   docker compose -f docker/docker-compose.yml up -d
#   docker compose -f docker/docker-compose.yml --profile test up -d postgres-plain
#
# backend-laravel/.env default menunjuk ke timescaledb ini (127.0.0.1:5433).
name: bunnybin-dev

services:
  timescaledb:
    image: timescale/timescaledb:latest-pg15
    environment:
      POSTGRES_DB: bunnybin
      POSTGRES_USER: bunnybin
      POSTGRES_PASSWORD: bunnybin
    ports:
      - "5433:5432"
    volumes:
      - pgdata-dev:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U bunnybin -d bunnybin"]
      interval: 10s
      retries: 5

  # Dev: port dipublish ke host (127.0.0.1:8800) karena Laravel jalan di host.
  # Produksi (Fase 8): internal-only via expose, tanpa publish.
  cv-service:
    build:
      context: ../cv-service-fastapi
      args:
        INSTALL_REAL: "true"
    # Rahasia (ROBOFLOW_API_KEY) dimuat dari docker/.env.roboflow yang GITIGNORED —
    # jangan hardcode di file ini. Setup: `cp .env.roboflow.example .env.roboflow`
    # lalu isi API key. required:false agar `up` tetap jalan tanpa file (mode dummy).
    #
    # ⚠ PRESEDENSI — sumber kebingungan yang sudah pernah memakan waktu:
    #
    #   blok `environment:` di bawah  MENGALAHKAN  isi `env_file:` ini.
    #
    # Jadi `CV_MODE=roboflow` di dalam .env.roboflow TIDAK PERNAH berlaku: ia
    # selalu ditimpa oleh `CV_MODE: ${CV_MODE:-...}`. Selama defaultnya kebetulan
    # juga `roboflow`, penimpaan itu tak terlihat — begitu defaultnya berubah,
    # container diam-diam berjalan di mode yang berbeda dari isi berkasnya.
    #
    # Yang benar-benar menentukan adalah interpolasi `${VAR}`, dan sumbernya
    # adalah **docker/.env** (berkas env milik Compose) atau environment shell.
    # Untuk mengubah mode/kunci, edit docker/.env — BUKAN .env.roboflow.
    env_file:
      - path: .env.roboflow
        required: false
    environment:
      # Default SENGAJA bukan roboflow lagi. Model
      # `deteksi-sampah-organik-anorganik/3` mengeluarkan nama kelas
      # "Sampah Organik"/"Sampah Anorganik" — itu KATEGORI, bukan nama benda.
      # Kiosk lalu menampilkan "Sampah Anorganik" untuk sebuah botol, dan tidak
      # ada satu pun benda spesifik yang bisa dicocokkan ke soal kuis
      # (lihat frontend-kiosk/src/lib/labelToQuiz.ts), sehingga SETIAP deteksi
      # jatuh ke soal acak dalam kategori. Itu bukan kasus tepi: itu perilaku
      # yang didapat siapa pun yang menjalankan `docker compose up` apa adanya.
      #
      # Penggantinya `real`, bukan `gemini`. Alasannya bukan mutu melainkan
      # kemampuan berjalan: mode gemini MENOLAK START tanpa GEMINI_API_KEY, jadi
      # menjadikannya default akan merusak `up` untuk semua orang yang belum
      # punya kunci. `real` memakai bobot yang sudah ter-mount di /model,
      # mengeluarkan nama objek (botol_plastik, kulit_buah, …), dan tidak
      # menyentuh jaringan sama sekali. Sejalan pula dengan docker-compose.prod.yml
      # yang memang sudah default `real`.
      #
      # Untuk memakai cloud: CV_MODE=gemini GEMINI_API_KEY=... docker compose up
      CV_MODE: ${CV_MODE:-real}
      CV_MODEL_PATH: ${CV_MODEL_PATH:-/model/best.pt}
      GEMINI_API_KEY: ${GEMINI_API_KEY:-}
      GEMINI_MODEL: ${GEMINI_MODEL:-gemini-3.5-flash}
      # CV_MODE=openai: penyedia apa pun berprotokol /chat/completions —
      # Groq (free tier 30/menit·14.400/hari, model open-weight), Ollama lokal,
      # OpenRouter. Lihat cv-service-fastapi/.env.example untuk nilai per penyedia.
      OPENAI_BASE_URL: ${OPENAI_BASE_URL:-}
      OPENAI_API_KEY: ${OPENAI_API_KEY:-}
      OPENAI_MODEL: ${OPENAI_MODEL:-}
      # Pengendali kuota (berlaku untuk mode vlm/gemini/openai). Tanpa baris ini
      # container selalu memakai default kode (10 rpm) — nilai yang benar untuk
      # free tier Gemini tapi memboroskan dua pertiga jatah Groq (30 rpm).
      VLM_MAX_RPM: ${VLM_MAX_RPM:-10}
      VLM_CACHE_TTL_S: ${VLM_CACHE_TTL_S:-15}
      VLM_TIMEOUT_S: ${VLM_TIMEOUT_S:-12}
      ROBOFLOW_MODEL_ID: ${ROBOFLOW_MODEL_ID:-}
      # Set di docker/.env (gitignored), pakai nilai yang SAMA dengan
      # CV_INTERNAL_TOKEN di backend/.env.
      #
      # Sengaja TIDAK memakai sintaks wajib `${VAR:?}`: compose menginterpolasi
      # seluruh berkas saat parsing, jadi variabel yang hilang akan menggagalkan
      # SETIAP perintah compose — termasuk `up -d timescaledb` yang tak ada
      # hubungannya. Penegakannya ada di layanannya sendiri: app/main.py menolak
      # start bila token kosong, sehingga jaminannya sama tanpa merusak alur dev.
      CV_INTERNAL_TOKEN: ${CV_INTERNAL_TOKEN:-}
    ports:
      - "127.0.0.1:8800:8000"
    volumes:
      - ../cv-service-fastapi/models:/model:ro

  # Port SENGAJA di-bind ke 127.0.0.1, bukan 0.0.0.0. Broker ini masih
  # allow_anonymous (lihat mosquitto/mosquitto.conf) dan backend mengambil
  # identitas device langsung dari nama topik — `binexa/{code}/sensor` — tanpa
  # verifikasi apa pun. Selama itu belum diperbaiki, satu perintah
  # mosquitto_pub dari jaringan yang sama sudah cukup untuk memalsukan
  # pembacaan sensor unit mana pun, memicu alert palsu, atau menahan unit
  # tetap "online" sehingga kerusakan nyata tak pernah terdeteksi.
  #
  # Membatasi ke loopback menutup akses itu tanpa memutus apa pun: ESP32 nyata
  # tidak berbicara MQTT (kiosk yang merelaynya lewat HTTP), dan mqtt:listen
  # serta simulate:devices berjalan di host yang sama.
  #
  # Ini MITIGASI, bukan perbaikan. Perbaikan sebenarnya = password_file +
  # acl_file per-unit (TODO-PERBAIKAN.md task 1.3).
  mosquitto:
    image: eclipse-mosquitto:2
    ports:
      - "127.0.0.1:1883:1883"
    volumes:
      - ./mosquitto/mosquitto.conf:/mosquitto/config/mosquitto.conf:ro
      # passwd GITIGNORED (hash password) — generate dari passwd.example.
      # acl ter-commit: kebijakan, bukan rahasia, dan justru perlu di-review.
      # Broker menolak start bila passwd belum dibuat — itu disengaja: lebih
      # baik gagal terang-terangan daripada diam-diam kembali anonim.
      - ./mosquitto/passwd:/mosquitto/config/passwd:ro
      - ./mosquitto/acl:/mosquitto/config/acl:ro
      - mosquitto-data-dev:/mosquitto/data

  # Postgres tanpa TimescaleDB — untuk menguji guard migration (PRD-Database.md §7:
  # migration harus tetap sukses tanpa extension). Jalankan dengan --profile test:
  #   DB_PORT=5435 php artisan migrate:fresh
  postgres-plain:
    image: postgres:15-alpine
    profiles: [test]
    environment:
      POSTGRES_DB: bunnybin
      POSTGRES_USER: bunnybin
      POSTGRES_PASSWORD: bunnybin
    ports:
      - "5435:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U bunnybin -d bunnybin"]
      interval: 10s
      retries: 5

volumes:
  pgdata-dev:
  mosquitto-data-dev:
