# Konfigurasi broker Binexa — DEV, tapi sudah berautentikasi.
#
# Sebelumnya berkas ini `allow_anonymous true` dengan alasan "supaya mudah
# simulasi via mosquitto_pub". Masalahnya, backend mengambil identitas device
# LANGSUNG dari nama topik (binexa/{code}/sensor → ProcessSensorReading) tanpa
# verifikasi apa pun. Broker anonim berarti siapa saja yang bisa menjangkau port
# ini boleh mengaku sebagai unit mana pun: memalsukan tong penuh, memicu alert
# palsu, atau menahan unit tetap "online" sehingga kerusakan nyata tak pernah
# muncul di dashboard.
#
# ACL di bawah yang benar-benar menutup lubang itu. Password saja tidak cukup:
# tanpa ACL, satu kredensial device yang bocor tetap bisa menulis atas nama
# SEMUA unit. Batasan per-topik lah yang mengikat kredensial ke satu unit.

listener 1883
allow_anonymous false

password_file /mosquitto/config/passwd
acl_file /mosquitto/config/acl

# Persistence supaya pesan QoS 1 tidak hilang saat broker restart — mqtt:listen
# subscribe dengan QoS 1 (MqttListen.php:24).
persistence true
persistence_location /mosquitto/data/

log_dest stdout
log_type warning
log_type error
log_type notice
